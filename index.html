    <script>
        // --- THREE.JS BACKGROUND SIMULATION ---
        let scene, camera, renderer, balls = [], trackCurve, trackMesh;
        let mouseX = 0, mouseY = 0;
        let boostFactor = 1;
        let cameraMode = 0; // 0: Orbiting, 1: Follow Lead Ball

        function initThreeJS() {
            const canvas = document.getElementById('bg-canvas');
            
            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05060f, 0.015);

            // Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 25, 60);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00f0ff, 2, 100);
            pointLight.position.set(0, 20, 0);
            scene.add(pointLight);

            const magentaLight = new THREE.PointLight(0xff007f, 2, 100);
            magentaLight.position.set(0, -20, 0);
            scene.add(magentaLight);

            // Create Track (Rollercoaster Curve)
            const points = [];
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const radius = 35 + Math.sin(i * 2) * 10;
                const y = Math.sin(i * 3) * 12;
                points.push(new THREE.Vector3(
                    Math.cos(angle) * radius,
                    y,
                    Math.sin(angle) * radius
                ));
            }
            trackCurve = new THREE.CatmullRomCurve3(points, true);

            // Track Mesh (Tube)
            const tubeGeometry = new THREE.TubeGeometry(trackCurve, 120, 1.2, 8, true);
            const tubeMaterial = new THREE.MeshBasicMaterial({
                color: 0x1a2340,
                wireframe: true,
                transparent: true,
                opacity: 0.25
            });
            trackMesh = new THREE.Mesh(tubeGeometry, tubeMaterial);
            scene.add(trackMesh);

            // Inner Neon Rail
            const railGeometry = new THREE.TubeGeometry(trackCurve, 120, 0.2, 6, true);
            const railMaterial = new THREE.MeshBasicMaterial({
                color: 0x00f0ff,
                wireframe: false,
                transparent: true,
                opacity: 0.6
            });
            const railMesh = new THREE.Mesh(railGeometry, railMaterial);
            scene.add(railMesh);

            // Create Racing Balls
            const ballColors = [0x00f0ff, 0xff007f, 0x7000ff, 0x00ff88, 0xffbb00];
            const ballGeo = new THREE.SphereGeometry(1.2, 32, 32);

            for (let i = 0; i < ballColors.length; i++) {
                const mat = new THREE.MeshStandardMaterial({
                    color: ballColors[i],
                    emissive: ballColors[i],
                    emissiveIntensity: 0.6,
                    roughness: 0.2,
                    metalness: 0.8
                });
                const mesh = new THREE.Mesh(ballGeo, mat);
                
                // Light aura around balls
                const pLight = new THREE.PointLight(ballColors[i], 1, 10);
                mesh.add(pLight);

                scene.add(mesh);

                balls.push({
                    mesh: mesh,
                    progress: i * 0.18, // staggered start
                    speed: 0.0015 + Math.random() * 0.0005,
                    color: ballColors[i]
                });
            }

            // Background Speed Particles
            const particleGeo = new THREE.BufferGeometry();
            const particleCount = 400;
            const posArray = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 200;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const particleMat = new THREE.PointsMaterial({
                size: 0.6,
                color: 0xffffff,
                transparent: true,
                opacity: 0.4
            });

            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);
        }

        function onMouseMove(event) {
            mouseX = (event.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (event.clientY / window.innerHeight - 0.5) * 2;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Decay boost smoothly
            if (boostFactor > 1) {
                boostFactor -= 0.03;
            } else {
                boostFactor = 1;
            }

            // Update Ball Positions along the track curve
            balls.forEach((ball, idx) => {
                ball.progress += ball.speed * boostFactor;
                if (ball.progress > 1) ball.progress -= 1;

                const point = trackCurve.getPointAt(ball.progress);
                const tangent = trackCurve.getTangentAt(ball.progress);

                ball.mesh.position.copy(point);
                
                // Add minor rotation for physics feel
                ball.mesh.rotation.x += 0.05 * boostFactor;
                ball.mesh.rotation.z += 0.03 * boostFactor;
            });

            // Camera Motion Logic
            if (cameraMode === 0) {
                // Free Orbiting Camera responsive to Mouse
                const targetX = mouseX * 15;
                const targetY = 25 - mouseY * 10;
                
                camera.position.x += (targetX - camera.position.x) * 0.03;
                camera.position.y += (targetY - camera.position.y) * 0.03;
                camera.lookAt(0, 0, 0);
            } else {
                // Follow Lead Ball Camera
                const leadBall = balls[0];
                const ballPos = leadBall.mesh.position;
                
                camera.position.x += (ballPos.x + 10 - camera.position.x) * 0.05;
                camera.position.y += (ballPos.y + 12 - camera.position.y) * 0.05;
                camera.position.z += (ballPos.z + 18 - camera.position.z) * 0.05;
                camera.lookAt(ballPos);
            }

            renderer.render(scene, camera);
        }

        window.onload = function() {
            initThreeJS();
            animate();

            // Interactive Controls
            const boostBtn = document.getElementById('boost-btn');
            if (boostBtn) {
                boostBtn.addEventListener('click', function() {
                    boostFactor = 3.5; // Boost speed temporarily
                });
            }

            const camToggleBtn = document.getElementById('cam-toggle');
            if (camToggleBtn) {
                camToggleBtn.addEventListener('click', function() {
                    cameraMode = cameraMode === 0 ? 1 : 0;
                    this.textContent = cameraMode === 0 ? "カメラモード切替 (追従)" : "カメラモード切替 (全景)";
                });
            }
        };
    </script>
